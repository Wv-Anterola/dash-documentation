# Runs the same checks the contributing guide asks for locally, on every push
# and pull request.
#
# The `audit:*` generators are deliberately not run here: they read a pinned
# revision of the separate Dash-Web repository, which CI does not have. Their
# output is committed, and the checks below prove that committed output is
# internally consistent, source-addressed, and matches what the pages claim.
name: Verify documentation

on:
  # Pushes to the published branch, and any branch that has a pull request open.
  # Listening on every branch as well as on `pull_request` ran the whole gate
  # twice for the same commit, which doubles the wait and makes the run list
  # unreadable at exactly the moment somebody is scanning it for a failure.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` is the usual choice, but the committed lock is generated on
      # Windows and does not contain sharp's Linux-only optional subtree, so a
      # clean install on this runner would fail on a platform difference rather
      # than on anything about the documentation. `npm install` resolves those
      # optional packages for the current platform and still honours the lock
      # for everything else.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Inventory invariants
        run: npm test

      - name: Text encoding
        run: npm run encoding

      - name: Capability coverage
        run: npm run coverage

      - name: Documentation quality
        run: npm run quality

      - name: Documented examples
        run: npm run examples

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Links, anchors, images, and heading order
        run: npm run links

      - name: Machine-readable entry points
        run: npm run endpoints

      - name: Accessibility
        run: npm run accessibility

      - name: Page weight budget
        run: npm run budget

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
