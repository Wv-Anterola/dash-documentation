# Keep the toolchain current without turning maintenance into a weekly chore.
#
# This site is a static build with a strong gate in front of it: every proposed
# update runs the whole `verify` chain before it can be merged, so an upgrade
# that breaks a generator, a page, or the accessibility budget shows up as a red
# check on its own pull request rather than as a surprise months later when
# somebody finally tries to build.
#
# Monthly rather than weekly, and grouped rather than one pull request per
# package, because the failure mode of this kind of automation is noise that
# people learn to close unread. Majors are separated: those need a person.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
      majors:
        update-types: ['major']
    commit-message:
      # Matches the repository's own commit style: a lowercase phrase.
      prefix: 'update'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'update'
