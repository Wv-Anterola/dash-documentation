title: Dash
description: >-
  Dash is a component-based hypermedia system built by Andries van Dam's
  research group at Brown University. This site documents how Dash works and
  what each student cohort has contributed to it.

# GitHub Pages builds this site with remote_theme. The just-the-docs project
# moved out of pmarsceill's account years ago; the old path still redirects,
# but pointing at the current one avoids depending on that redirect.
remote_theme: just-the-docs/just-the-docs

color_scheme: dash
logo: "/assets/images/medium-blue-light-blue.png"
baseurl: "/Dash-Documentation"
url: "https://brown-dash.github.io"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools

nav_external_links:
  - title: Dash on GitHub
    url: https://github.com/brown-dash

heading_anchors: true
search_enabled: true
search:
  heading_level: 2
  previews: 2
  tokenizer_separator: /[\s/]+/
  button: false

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Maintained by the Dash research group, Department of Computer Science,
  Brown University.

# Show a "last edited" stamp so readers can judge how current a page is.
# Several pages on the old site were years stale with nothing to signal it.
last_edit_timestamp: true
last_edit_time_format: "%b %e, %Y"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/brown-dash/Dash-Documentation"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

callouts:
  note:
    title: Note
    color: blue
  caveat:
    title: Caveat
    color: yellow
  removed:
    title: No longer in Dash
    color: red
