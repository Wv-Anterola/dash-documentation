title: Dash
# jekyll-seo-tag puts `tagline` after the title in <title>; without it, it uses
# the whole description, which made every page title a paragraph long.
tagline: Hypermedia research at Brown University
description: >-
  Documentation and project history for Dash, a component-based hypermedia
  system built by Andries van Dam's research group at Brown University.

# GitHub Pages builds this site with remote_theme. The just-the-docs project
# moved out of pmarsceill's account years ago; the old path still redirects,
# but pointing at the current one avoids depending on that redirect.
remote_theme: just-the-docs/just-the-docs

color_scheme: dash
logo: "/assets/images/medium-blue-light-blue.png"
baseurl: "/Dash-Documentation"
url: "https://brown-dash.github.io"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# The sidebar is grouped with these collections. just-the-docs renders one
# heading per collection and keeps a full parent/child tree inside each, which
# a single flat page list cannot do: the theme allows three nesting levels, and
# Features > Trails > Tips already uses all three.
#
# Every page carries an explicit `permalink`, so which directory a page lives in
# does not affect its URL. Moving a page between collections is a nav change
# only.
collections:
  concepts:
    permalink: "/:path/"
    output: true
  guide:
    permalink: "/:path/"
    output: true
  system:
    permalink: "/:path/"
    output: true
  research:
    permalink: "/:path/"
    output: true
  contribute:
    permalink: "/:path/"
    output: true

just_the_docs:
  collections:
    concepts:
      name: Concepts
    guide:
      name: Using Dash
    system:
      name: System and architecture
    research:
      name: Research and history
    contribute:
      name: Contributing

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools

nav_external_links:
  - title: Dash on GitHub
    url: https://github.com/brown-dash

heading_anchors: true
search_enabled: true
search:
  heading_level: 2
  previews: 2
  tokenizer_separator: /[\s/]+/
  button: false

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Maintained by the Dash research group, Department of Computer Science,
  Brown University.

# Show a "last edited" stamp so readers can judge how current a page is.
# Several pages on the old site were years stale with nothing to signal it.
last_edit_timestamp: true
last_edit_time_format: "%b %e, %Y"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/brown-dash/Dash-Documentation"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

callouts:
  note:
    title: Note
    color: blue
  caveat:
    title: Caveat
    color: yellow
  removed:
    title: No longer in Dash
    color: red
