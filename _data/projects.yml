2019-2020:
  - title: Document and field model
    people: [Bob Zeleznik, Tyler Schicke, Sam Wilkins]
    status: integrated
    area: Document model
    concepts: [documents]
    problem: >-
      A hypermedia system needs one representation that a PDF, a video, a text
      note, and a collection can all be, or the links between them are special
      cases forever.
    approach: >-
      A single document abstraction with typed fields, prototype inheritance
      between documents, and instances created from prototypes.
    contribution: >-
      The document model, the field system, and the server that persists it.
    relation: >-
      Everything else in this list is built on it. `Documents.ts` and
      `DocumentTypes.ts` are still the files where a new document type gets
      registered.
    outcome: >-
      In `master`, six years on.
