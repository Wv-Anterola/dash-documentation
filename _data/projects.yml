  - title: Desktop build with local model execution
    people: [Bob Zeleznik]
    status: integrated
    area: Infrastructure
    concepts: [agents]
    problem: >-
      Every AI feature in Dash assumed an API key and a network round-trip,
      which rules out anyone who cannot or will not send their documents to a
      third party.
    approach: >-
      Package Dash as an Electron application and bundle Ollama with it, so
      models run on the user's own machine.
    contribution: >-
      Electron packaging for macOS and Windows, an Ollama download and bundling
      step in the build, and an agent service that talks to a local model.
    relation: >-
      Changes how the whole AI surface is deployed rather than adding a feature
      to it.
    outcome: >-
      Build scripts are in `master` and produce signed macOS and Windows
      artefacts. Building the macOS disk image was still unreliable as of the
      June 2026 demo.
    tech: [Electron, Ollama, electron-builder]
    code: "`electron-main.cjs`, `scripts/download-ollama.cjs`, `agent/services/ollamaService.ts`"
    evidence: >-
      `build:mac`, `build:windows`, and `download:ollama` are npm scripts in
      `package.json` on `master`; `ollamaService.ts` is present.

