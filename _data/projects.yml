  - title: Multi-objective trip planner
    people: [Wilber Sean Anterola]
    status: implemented
    area: Document model
    concepts: [documents]
    problem: >-
      Itinerary planning is a scheduling problem with objectives that genuinely
      conflict: travel time, weather risk, opening hours, how well an event fits
      what you said you wanted.
    approach: >-
      A deterministic heuristic optimiser rather than a single exact
      formulation. It generates candidate itineraries, scores each on six
      objectives, normalises the weights, and ranks by a Pareto frontier, with
      live routing data overriding a Haversine fallback when it is fresh.
    contribution: >-
      The scoring model and its implementation, written up separately with the
      formulas rather than left implicit in the code.
    relation: >-
      Built as a Dash surface, on a branch. Travel-planning features were
      removed from the demo build afterwards.
    outcome: >-
      Working on a branch; math and implementation notes written up. Not merged.
    tech: [TypeScript, Mapbox]
    code: "branch `wv-anterola-trip-planner`; `TripPlannerAnalysis.ts`"
    evidence: >-
      Branch is unmerged. A later commit on a separate branch explicitly removes
      travel-planning features, so this is not on the path to `master` as it
      stands.

