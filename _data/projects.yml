# Projects, grouped by cohort id.
#
# HOW STATUS IS DECIDED
# ---------------------
# `status` uses the keys in statuses.yml. "integrated" requires evidence in the
# current Dash-Web `master` branch: a document type registered in
# `client/documents/Documents.ts`, an entry in `CollectionViewType`, a tool
# constructed in `chatbot/agentsystem/Agent.ts`, or source that one of those
# calls. `evidence` records what we actually checked, so the next person can
# re-check it instead of trusting this file.
#
# Dash-Web is a private repository, so `code` gives paths and branch names
# rather than links. They will only resolve for people with repo access.
#
# ADDING A PROJECT
# ----------------
# Add an entry under the right cohort id. `title`, `status`, and `problem` are
# required; everything else is optional and simply doesn't render when absent.

2026:
  - title: Post-hoc oversight of prompt-injected agents
    people: [Wilber Sean Anterola]
    status: prototype
    area: Agent system
    concepts: [agents]
    problem: >-
      Dash's agent reads documents it did not write and can edit the workspace
      through tool calls, which is exactly the shape indirect prompt injection
      exploits. Nearly every proposed defence is automated and is scored on
      whether the attack was blocked. Almost nothing measures the fallback that
      real deployments still keep: a person looking at what the agent did.
    approach: >-
      A within-subjects study run inside Dash. Participants review edits the
      agent has already applied to their documents and decide what to keep and
      what to undo, with a genuine injection seeded among the legitimate edits.
      The manipulation is action provenance, meaning whether the interface shows
      which piece of source content caused each edit.
    contribution: >-
      Three pieces of instrumentation were built on top of the existing agent.
      An action-provenance record attaches to each tool call as it passes
      through the undo system, so every edit carries the source that triggered
      it. An async undo-batch wrapper makes individual agent actions separately
      revertible. A phase-0 harness runs an injection corpus against the write
      tools and scores go/no-go, to check the attack lands often enough for a
      study to be worth running at all. Provenance capture is off by default.
    relation: >-
      It uses Dash rather than adding to it. The reason for using Dash is that
      the workspace is persistent, shared, and reversible, which is the property
      a chat-only harness cannot provide and the thing that makes "review the
      edits and undo the bad ones" a real task.
    outcome: >-
      Proposal drafted and revised to meet advisor approval conditions; harness
      and provenance layer working behind a flag; a Playwright end-to-end test
      covers the injection flow. The study has not been run.
    tech: [TypeScript, MobX, Playwright, OpenAI API]
    code: "Dash-Web branch `wv-anterola-agent-oversight`; `PROPOSAL.md`"
    evidence: >-
      Provenance sources are on the branch only. Searching `master` for
      "provenance" under `src/` returns nothing, so this is not in the shipped
      application.

  - title: Policy testimony and policy checker documents
    people: [Aura Sukapanpotharam]
    status: integrated
    area: Document model
    concepts: [documents, agents]
    problem: >-
      Reading a policy document against a pile of supporting testimony means
      holding both in your head at once and keeping track of which claim came
      from where.
    approach: >-
      Two linked document types. A testimony document holds source material; a
      checker document analyses a policy against the testimony linked to it and
      reports back with citations you can filter by source.
    contribution: >-
      Both node types, the citation panel, source-list filtering, and the
      re-analyse flow. A fair amount of the work was the unglamorous kind:
      making the checker scroll properly, greying out controls during analysis,
      and letting links be deleted from the checker without orphaning results.
    relation: >-
      Registered as first-class Dash document types, so they participate in
      linking, layout, and collections like anything else.
    outcome: >-
      Merged to `master` in June 2026. Known remaining issues are UI-level.
    tech: [TypeScript, React, OpenAI API]
    code: "`DocumentType.POLICY_TESTIMONY`, `DocumentType.POLICY_CHECKER`; branch `aura`"
    evidence: >-
      Both types are declared in `DocumentTypes.ts` and constructed in
      `Documents.ts`. Branch `aura` is merged into `origin/master`.

  - title: Graph view for collections
    people: [Finn Wilkie]
    status: integrated
    area: Collections and views
    concepts: [collections, links]
    problem: >-
      Dash has had links between documents since the beginning, but no way to
      look at the link structure itself. You could follow a link; you could not
      see the shape of what you had built.
    approach: >-
      A collection view that lays documents out as a force-directed graph, with
      links as edges, and a settings panel exposing the physics constants rather
      than hiding them.
    contribution: >-
      A layout engine that scales its work by node count and stops early once
      movement settles, which matters because the alternative is a MobX
      re-render storm on every frame. On top of that: creating links by dragging
      in the graph, neighbour highlighting on hover, document previews in the
      graph including non-text documents, and a title toggle.
    relation: >-
      Added as a `CollectionViewType`, so any existing collection can be
      switched into it without converting anything.
    outcome: >-
      In `master` and selectable on any collection. Link creation in the graph
      is undoable.
    tech: [TypeScript, React, MobX]
    code: "`collections/collectionGraph/`, `collectionFreeFormLayoutEngines/GraphLayoutEngine.tsx`"
    evidence: >-
      `CollectionViewType.Graph` is in the enum and switched on in
      `CollectionView.tsx`.

