# Cohort rosters, keyed by the cohort ids in cohorts.yml.
#
# Names are taken from commit authorship in the Dash-Web repository over each
# cohort's date range, cross-checked against the team list the site has carried
# since 2021. Git is the stronger source: the old team page was missing most of
# the 2019-2020 contributors entirely.
#
# `handle` is used where a GitHub account has no name attached to it and we
# could not match it to a person. Please replace those if you know who they are.
#
# `faculty` and `staff` are listed once, at the top level, because they span
# every cohort rather than belonging to one.

