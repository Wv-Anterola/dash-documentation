# The concept pages, in reading order.
#
# `id` is what projects.yml refers to in each project's `concepts:` list. The
# link is one-directional in the data and made bidirectional by two includes:
# projects-for-concept.html looks up projects by concept id, and
# concepts-for-project.html looks up concepts from a project entry.

- id: documents
  title: Documents and fields
  url: /concepts/documents/
  summary: >-
    Every piece of content in Dash is a document, including collections and the
    links between them. What varies is the type and the fields.

- id: collections
  title: Collections and views
  url: /concepts/collections/
  summary: >-
    A collection is a document that holds other documents. How it displays them
    is a property, so switching layout converts nothing.

- id: links
  title: Links and anchors
  url: /concepts/links/
  summary: >-
    A link can start or end at a region, a selection, or a timestamp rather
    than a whole file, and the link is itself a document.

- id: trails
  title: Trails
  url: /concepts/trails/
  summary: >-
    A prepared path through a corpus that you can leave at any point to follow
    links by association instead.

- id: agents
  title: Agents and tools
  url: /concepts/agents/
  summary: >-
    A registry of tools a language model can call, several of which write to
    the shared workspace, and what that implies for trust.

- id: generative
  title: Generative media
  url: /concepts/generative/
  summary: >-
    Model-generated images, video, charts, and text produced inside documents
    rather than pasted into them.
