# Implementation-status vocabulary.
#
# Every project in projects.yml carries one of these keys. The rule we apply:
# a project is only "integrated" if we can point at it in the current
# Dash-Web `master` branch, either as a registered document type, a registered
# agent tool, a collection view, or a code path something else on master calls.
# A merged branch, a screenshot, or a demo recording is not enough on its own.

- key: integrated
  label: Integrated
  class: status--integrated
  blurb: >-
    Present in the current Dash application and reachable from the interface.
    Verified against `master`: a registered document type, collection view,
    agent tool, or a code path called by one of those.

- key: implemented
  label: Implemented, not integrated
  class: status--implemented
  blurb: >-
    Working code exists on a branch or in a separate harness, but it is not
    merged into `master` and does not run in the application people use.

- key: prototype
  label: Prototype or exploration
  class: status--prototype
  blurb: >-
    A partial implementation, experiment, or study instrument. Enough exists to
    demonstrate or measure something; it was not built to ship as a feature.

- key: archived
  label: Archived or superseded
  class: status--archived
  blurb: >-
    Was part of Dash at some point and is not any more, either removed outright
    or replaced by a later system.

- key: docs-only
  label: Documentation only
  class: status--docs-only
  blurb: >-
    Described in documentation or a report, but we could not find the
    corresponding implementation to confirm it.

- key: unclear
  label: Status unclear
  class: status--unclear
  blurb: >-
    Evidence is thin or points in two directions. Listed so it is not silently
    dropped, and so someone who knows can correct it.
