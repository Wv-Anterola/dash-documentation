<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dash scripting compiler and execution runtime</title>
  <desc id="desc">A seven-stage pipeline from script source and options through AST hooks, TypeScript emission, diagnostic filtering, JavaScript Function construction, argument and capture binding, document execution, and structured success or failure results. Side paths show saved-function registration and cache behavior.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09101e"/><stop offset="1" stop-color="#171a36"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7659ff"/><stop offset="1" stop-color="#b275ff"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26bdd3"/><stop offset="1" stop-color="#57e1b7"/></linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff668c"/><stop offset="1" stop-color="#ff9f71"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#02040d" flood-opacity=".5"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#8994bd"/></marker>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,SFMono-Regular,monospace}.muted{fill:#aab3d3}.stage{fill:#151d35;stroke:#3b466f;stroke-width:2}.stageTitle{fill:#f6f7ff;font-size:19px;font-weight:800}.stageText{fill:#c5cbe4;font-size:15px}.chip{fill:#222b4a;stroke:#48547e}.chipText{fill:#e2e6ff;font-size:16px;font-weight:700}.num{fill:#0a1120;font-size:16px;font-weight:900;text-anchor:middle;dominant-baseline:middle}.small{font-size:14px}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1460" cy="80" r="260" fill="#7659ff" opacity=".09"/><circle cx="140" cy="850" r="250" fill="#2bd0c6" opacity=".06"/>
  <g class="sans">
    <text x="74" y="78" fill="#f7f8ff" font-size="42" font-weight="820">From source text to a Dash mutation</text>
    <text x="74" y="119" class="muted" font-size="20">The real in-browser compiler, registry closure, invocation context, and result boundary</text>
    <g transform="translate(1035 57)"><rect class="chip" width="150" height="48" rx="24"/><text x="75" y="31" text-anchor="middle" class="chipText">151 globals</text><rect class="chip" x="164" width="150" height="48" rx="24"/><text x="239" y="31" text-anchor="middle" class="chipText">12 families</text><rect class="chip" x="328" width="160" height="48" rx="24"/><text x="408" y="31" text-anchor="middle" class="chipText">2 dynamic sites</text></g>

    <g transform="translate(65 185)">
      <g filter="url(#shadow)"><rect class="stage" width="195" height="250" rx="20"/><circle cx="28" cy="29" r="16" fill="url(#purple)"/><text x="28" y="30" class="num">1</text><text x="53" y="36" class="stageTitle">Author input</text><text x="22" y="83" class="stageText"><tspan x="22">TypeScript-like source</tspan><tspan x="22" dy="25">ScriptOptions:</tspan><tspan x="34" dy="23">params • captures</tspan><tspan x="34" dy="23">addReturn • type</tspan><tspan x="34" dy="23">editable • globals</tspan><tspan x="34" dy="23">traverser • transform</tspan></text></g>
      <path d="M205 125 H244" stroke="#8994bd" stroke-width="4" marker-end="url(#arrow)"/>
      <g transform="translate(255)" filter="url(#shadow)"><rect class="stage" width="195" height="250" rx="20"/><circle cx="28" cy="29" r="16" fill="url(#purple)"/><text x="28" y="30" class="num">2</text><text x="53" y="36" class="stageTitle">AST hooks</text><text x="22" y="83" class="stageText"><tspan x="22">Optional pre-order and</tspan><tspan x="22" dy="23">post-order traversal</tspan><tspan x="22" dy="31">Optional TypeScript</tspan><tspan x="22" dy="23">transformer rewrites</tspan><tspan x="22" dy="31">Document labels can</tspan><tspan x="22" dy="23">become references.</tspan></text></g>
      <path d="M460 125 H499" stroke="#8994bd" stroke-width="4" marker-end="url(#arrow)"/>
      <g transform="translate(510)" filter="url(#shadow)"><rect class="stage" width="195" height="250" rx="20"/><circle cx="28" cy="29" r="16" fill="url(#purple)"/><text x="28" y="30" class="num">3</text><text x="53" y="36" class="stageTitle">Wrap + emit</text><text x="22" y="83" class="stageText"><tspan x="22">Build function params</tspan><tspan x="22" dy="23">and optional return.</tspan><tspan x="22" dy="31">In-browser TypeScript</tspan><tspan x="22" dy="23">program emits JS.</tspan><tspan x="22" dy="31">Doc parameter types are</tspan><tspan x="22" dy="23">written as any.</tspan></text></g>
      <path d="M715 125 H754" stroke="#8994bd" stroke-width="4" marker-end="url(#arrow)"/>
      <g transform="translate(765)" filter="url(#shadow)"><rect class="stage" width="195" height="250" rx="20"/><circle cx="28" cy="29" r="16" fill="url(#rose)"/><text x="28" y="30" class="num">4</text><text x="53" y="36" class="stageTitle">Diagnostics</text><text x="22" y="83" class="stageText"><tspan x="22">Filter dynamic-field</tspan><tspan x="22" dy="23">codes 2304, 2339,</tspan><tspan x="22" dy="23">2693, and 2314.</tspan><tspan x="22" dy="31">2552 is conditionally</tspan><tspan x="22" dy="23">filtered for a registered</tspan><tspan x="22" dy="23">global name.</tspan></text></g>
      <path d="M970 125 H1009" stroke="#8994bd" stroke-width="4" marker-end="url(#arrow)"/>
      <g transform="translate(1020)" filter="url(#shadow)"><rect class="stage" width="195" height="250" rx="20"/><circle cx="28" cy="29" r="16" fill="url(#teal)"/><text x="28" y="30" class="num">5</text><text x="53" y="36" class="stageTitle">Build closure</text><text x="22" y="83" class="stageText"><tspan x="22" class="mono">new Function(</tspan><tspan x="22" dy="23" class="mono"> ...globalNames,</tspan><tspan x="22" dy="23" class="mono"> "return " + js)</tspan><tspan x="22" dy="33">Global values are passed</tspan><tspan x="22" dy="23">in the same insertion</tspan><tspan x="22" dy="23">order as their names.</tspan></text></g>
      <path d="M1225 125 H1264" stroke="#8994bd" stroke-width="4" marker-end="url(#arrow)"/>
      <g transform="translate(1275)" filter="url(#shadow)"><rect class="stage" width="195" height="250" rx="20"/><circle cx="28" cy="29" r="16" fill="url(#teal)"/><text x="28" y="30" class="num">6</text><text x="53" y="36" class="stageTitle">Bind + run</text><text x="22" y="83" class="stageText"><tspan x="22">args override captures</tspan><tspan x="22" dy="23">for named parameters.</tspan><tspan x="22" dy="31">args.this or captured</tspan><tspan x="22" dy="23">this becomes receiver.</tspan><tspan x="22" dy="31">Registered globals can</tspan><tspan x="22" dy="23">reach application state.</tspan></text></g>
    </g>

    <g transform="translate(65 505)">
      <rect x="0" width="440" height="155" rx="19" fill="#121a31" stroke="#3a4770" stroke-width="2"/>
      <circle cx="31" cy="31" r="16" fill="url(#purple)"/><text x="31" y="32" class="num">A</text><text x="58" y="38" class="stageTitle">Compile cache</text>
      <text x="25" y="78" class="stageText"><tspan x="25">Key = transformed source + primitive capture signature.</tspan><tspan x="25" dy="25">A RefField capture writes XXX and disables insertion, so</tspan><tspan x="25" dy="25">one document identity cannot reuse another closure.</tspan></text>

      <rect x="465" width="440" height="155" rx="19" fill="#121a31" stroke="#3a4770" stroke-width="2"/>
      <circle cx="496" cy="31" r="16" fill="url(#purple)"/><text x="496" y="32" class="num">B</text><text x="523" y="38" class="stageTitle">Saved function side path</text>
      <text x="490" y="78" class="stageText"><tspan x="490">ScriptManager reads name, raw source, and data-params</tspan><tspan x="490" dy="25">from the main script collection, creates new Function,</tspan><tspan x="490" dy="25">then removes/re-adds that dynamic case-sensitive name.</tspan></text>

      <rect x="930" width="540" height="155" rx="19" fill="#121a31" stroke="#3a4770" stroke-width="2"/>
      <circle cx="961" cy="31" r="16" fill="url(#teal)"/><text x="961" y="32" class="num">7</text><text x="988" y="38" class="stageTitle">Structured result boundary</text>
      <text x="955" y="78" class="stageText"><tspan x="955" class="mono">success → { success: true, result }</tspan><tspan x="955" dy="27" class="mono">throw   → { success: false, error, result: errorVal }</tspan><tspan x="955" dy="28">Both paths end Doc.MakeReadOnly when editable is false.</tspan></text>
    </g>

    <g transform="translate(65 705)">
      <rect width="1470" height="130" rx="22" fill="#21182a" stroke="#8b5276" stroke-width="2"/>
      <path d="M30 28 50 66 10 66Z" fill="#ff7d95"/><text x="30" y="59" text-anchor="middle" fill="#28131c" font-size="21" font-weight="900">!</text>
      <text x="75" y="48" fill="#fff2f6" font-size="21" font-weight="800">Trust boundary: this is executable application code, not a sandbox</text>
      <text x="75" y="81" fill="#e0bfd0" font-size="17">Compilation permissiveness supports dynamic document fields; it does not prove a field exists, a mutation is authorized, or a called service is safe.</text>
      <text x="75" y="108" fill="#e0bfd0" font-size="17">Temporary globals are dependency injection, not isolation. User-visible writes still need explicit scope, permission checks, and one named undo boundary.</text>
    </g>
  </g>
</svg>
