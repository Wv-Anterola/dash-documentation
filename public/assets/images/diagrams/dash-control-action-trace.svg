<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dash interface control action trace</title>
  <desc id="desc">A source-backed trace of the Image Rotate control from its visible toolbar button through a document-backed descriptor, visibility rule, FontIcon rendering, scripting-global dispatch, selected ImageBox rotate method, and visible result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071527"/>
      <stop offset="0.55" stop-color="#0b2136"/>
      <stop offset="1" stop-color="#102a3d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff7fb"/>
      <stop offset="1" stop-color="#dceaf1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52d6c6"/>
      <stop offset="1" stop-color="#6aa7ff"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcc66"/>
      <stop offset="1" stop-color="#ff8c5a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020b14" flood-opacity="0.42"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#86a5b8" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#62cfca"/>
    </marker>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .eyebrow { fill: #77ded4; font-size: 18px; font-weight: 800; letter-spacing: 3px; }
      .heading { fill: #f5fbff; font-size: 48px; font-weight: 800; letter-spacing: -1px; }
      .subheading { fill: #b6cad7; font-size: 21px; }
      .step { fill: #83eee2; font-size: 14px; font-weight: 850; letter-spacing: 1.6px; }
      .cardtitle { fill: #eefaff; font-size: 21px; font-weight: 780; }
      .body { fill: #b9ced9; font-size: 16px; }
      .code { fill: #d7f7f1; font-size: 14px; }
      .uilabel { fill: #d5e4ec; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1420" cy="90" r="190" fill="#278a94" opacity="0.13" filter="url(#soft)"/>
  <circle cx="210" cy="860" r="220" fill="#3779cb" opacity="0.11" filter="url(#soft)"/>

  <g class="ui">
    <text x="74" y="62" class="eyebrow">DASH INTERFACE CONTRACT</text>
    <text x="74" y="117" class="heading">One click, fully traced</text>
    <text x="74" y="154" class="subheading">Visible control → registry → predicate → handler → state owner → visible result</text>

    <g filter="url(#shadow)">
      <rect x="72" y="196" width="690" height="618" rx="26" fill="#0d1a27" stroke="#345064" stroke-width="2"/>
      <rect x="91" y="215" width="652" height="580" rx="15" fill="url(#screen)"/>
    </g>

    <rect x="91" y="215" width="652" height="52" rx="15" fill="#173a4e"/>
    <rect x="91" y="250" width="652" height="17" fill="#173a4e"/>
    <circle cx="119" cy="241" r="12" fill="#63d6ca"/>
    <text x="141" y="247" fill="#f3fbff" font-size="17" font-weight="800">brown</text>
    <text x="194" y="247" fill="#70c8ff" font-size="17" font-weight="800">dash</text>
    <rect x="623" y="229" width="72" height="25" rx="12" fill="#2c5368"/>
    <text x="641" y="247" fill="#ecf8fd" font-size="12" font-weight="700">Share</text>
    <circle cx="718" cy="241" r="10" fill="#6fc8ff"/>

    <rect x="91" y="267" width="652" height="53" fill="#264b5f"/>
    <g class="uilabel">
      <text x="111" y="299">Perspective</text>
      <text x="205" y="299">Pin</text>
      <text x="245" y="299">Fill</text>
      <text x="292" y="299">Border</text>
      <text x="352" y="299">Text</text>
    </g>
    <rect x="393" y="276" width="258" height="35" rx="9" fill="#0e2432" stroke="#6ad7d0" stroke-width="2"/>
    <text x="410" y="299" fill="#7fe5dd" font-size="13" font-weight="850">IMAGE</text>
    <rect x="468" y="281" width="61" height="25" rx="7" fill="#294b5d"/>
    <text x="479" y="298" fill="#dcebf2" font-size="12">Pixels</text>
    <rect x="535" y="278" width="67" height="31" rx="8" fill="url(#hot)"/>
    <path d="M550 295a9 9 0 1 0 5-8" fill="none" stroke="#172533" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M551 285l6 1-2 6" fill="none" stroke="#172533" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="567" y="298" fill="#142333" font-size="12" font-weight="850">Rotate</text>
    <rect x="608" y="281" width="34" height="25" rx="7" fill="#294b5d"/>
    <text x="616" y="298" fill="#dcebf2" font-size="11">Mask</text>

    <rect x="91" y="320" width="74" height="475" fill="#19384b"/>
    <g fill="#d8e7ee">
      <circle cx="128" cy="357" r="13"/><rect x="113" y="388" width="30" height="25" rx="5"/><path d="M113 441h30v23h-30z"/><path d="M113 492h30v25h-30z"/><circle cx="128" cy="553" r="14"/><path d="M113 590h30v28h-30z"/>
    </g>
    <g fill="#92adbb" font-size="10" text-anchor="middle">
      <text x="128" y="378">Search</text><text x="128" y="428">Files</text><text x="128" y="479">Tools</text><text x="128" y="532">Imports</text><text x="128" y="579">Trails</text>
    </g>

    <rect x="165" y="320" width="578" height="475" fill="url(#grid)"/>
    <rect x="229" y="380" width="392" height="316" rx="16" fill="#ffffff" stroke="#ff9b60" stroke-width="4"/>
    <rect x="229" y="380" width="392" height="42" rx="14" fill="#304f60"/>
    <rect x="229" y="408" width="392" height="14" fill="#304f60"/>
    <text x="250" y="407" fill="#f2f9fc" font-size="15" font-weight="750">Selected image document</text>
    <g transform="translate(279 460)">
      <rect width="292" height="176" rx="10" fill="#d9eef4"/>
      <circle cx="224" cy="48" r="24" fill="#ffbd65"/>
      <path d="M0 146l70-70 50 48 45-37 127 89H0z" fill="#63b8a9"/>
      <path d="M0 158l92-54 61 35 57-30 82 67H0z" fill="#347b91" opacity="0.9"/>
      <path d="M255 149a34 34 0 0 0 17-45" fill="none" stroke="#ff8c5a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    </g>

    <path d="M568 272C633 239 713 257 778 302" fill="none" stroke="#ffad64" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
    <rect x="642" y="330" width="91" height="48" rx="11" fill="#ffb35f"/>
    <text x="687.5" y="350" text-anchor="middle" fill="#182532" font-size="12" font-weight="850">YOU CLICK</text>
    <text x="687.5" y="367" text-anchor="middle" fill="#182532" font-size="12" font-weight="850">ROTATE</text>

    <path d="M762 506H803" fill="none" stroke="#62cfca" stroke-width="3" marker-end="url(#arrow)"/>

    <g>
      <rect x="822" y="194" width="706" height="98" rx="18" fill="#102d3d" stroke="#376376" stroke-width="1.5"/>
      <circle cx="861" cy="243" r="22" fill="#153e4c" stroke="#67d7cd" stroke-width="2"/>
      <text x="861" y="249" text-anchor="middle" class="step">01</text>
      <text x="900" y="226" class="cardtitle">Descriptor says what the control is</text>
      <text x="900" y="251" class="code mono">title: “Rotate” · toolTip: “Rotate 90” · ClickButton</text>
      <text x="900" y="274" class="body">CurrentUserUtils.imageTools() is the source registry.</text>

      <path d="M861 292V312" fill="none" stroke="#62cfca" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="822" y="314" width="706" height="98" rx="18" fill="#102d3d" stroke="#376376" stroke-width="1.5"/>
      <circle cx="861" cy="363" r="22" fill="#153e4c" stroke="#67d7cd" stroke-width="2"/>
      <text x="861" y="369" text-anchor="middle" class="step">02</text>
      <text x="900" y="346" class="cardtitle">Selection controls whether the group opens</text>
      <text x="900" y="371" class="code mono">SelectedDocType(DocumentType.IMG, expertMode)</text>
      <text x="900" y="394" class="body">No selected image means no expanded Image tool row.</text>

      <path d="M861 412V432" fill="none" stroke="#62cfca" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="822" y="434" width="706" height="98" rx="18" fill="#102d3d" stroke="#376376" stroke-width="1.5"/>
      <circle cx="861" cy="483" r="22" fill="#153e4c" stroke="#67d7cd" stroke-width="2"/>
      <text x="861" y="489" text-anchor="middle" class="step">03</text>
      <text x="900" y="466" class="cardtitle">Dash renders a document as the button</text>
      <text x="900" y="491" class="code mono">setupLinearMenu() → FontIconDocument → FontIconBox</text>
      <text x="900" y="514" class="body">The button is persisted/configured through Dash’s document model.</text>

      <path d="M861 532V552" fill="none" stroke="#62cfca" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="822" y="554" width="706" height="98" rx="18" fill="#102d3d" stroke="#376376" stroke-width="1.5"/>
      <circle cx="861" cy="603" r="22" fill="#153e4c" stroke="#67d7cd" stroke-width="2"/>
      <text x="861" y="609" text-anchor="middle" class="step">04</text>
      <text x="900" y="586" class="cardtitle">The click dispatches a scripting global</text>
      <text x="900" y="611" class="code mono">onClick: imageRotate90() → ScriptingGlobals</text>
      <text x="900" y="634" class="body">The same script mechanism also supports authored Dash buttons.</text>

      <path d="M861 652V672" fill="none" stroke="#62cfca" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="822" y="674" width="706" height="98" rx="18" fill="#102d3d" stroke="#376376" stroke-width="1.5"/>
      <circle cx="861" cy="723" r="22" fill="#153e4c" stroke="#67d7cd" stroke-width="2"/>
      <text x="861" y="729" text-anchor="middle" class="step">05</text>
      <text x="900" y="706" class="cardtitle">The selected renderer owns the actual operation</text>
      <text x="900" y="731" class="code mono">DocumentView.Selected().lastElement()?.rotate()</text>
      <text x="900" y="754" class="body">The visible image rotates; selection and undo systems observe the change.</text>
    </g>

    <rect x="822" y="796" width="706" height="48" rx="13" fill="url(#accent)" opacity="0.16" stroke="#72ddd5"/>
    <text x="1175" y="826" text-anchor="middle" fill="#dffbf7" font-size="16" font-weight="750">Each searchable contract keeps these five layers together.</text>
  </g>
</svg>
