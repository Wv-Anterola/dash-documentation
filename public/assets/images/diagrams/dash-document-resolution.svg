<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dash document resolution</title>
  <desc id="desc">A diagram separating a data document, prototype, contextual layout delegate, proxy reference, and React view.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f9fd"/><stop offset="1" stop-color="#e7f1f9"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#16344f" flood-opacity=".16"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#3c6688"/></marker></defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg2)"/>
  <text x="90" y="82" fill="#102b46" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="700">One visible node resolves through five roles</text>
  <text x="90" y="124" fill="#526d84" font-family="Inter,Segoe UI,sans-serif" font-size="22">Correct code writes to the role that owns the meaning—not simply to the object at hand.</text>
  <g font-family="Inter,Segoe UI,sans-serif" filter="url(#s)">
    <rect x="110" y="260" width="290" height="250" rx="24" fill="#fff" stroke="#7aa6c7" stroke-width="2"/><text x="145" y="310" fill="#25758d" font-size="17" font-weight="700">DEFAULTS</text><text x="145" y="355" fill="#173650" font-size="28" font-weight="700">Prototype</text><text x="145" y="402" fill="#526d84" font-size="19">inherited fields</text><text x="145" y="438" fill="#526d84" font-size="19">type behavior</text><text x="145" y="474" fill="#526d84" font-size="19">shared configuration</text>
    <rect x="500" y="210" width="350" height="350" rx="28" fill="#167a9c"/><text x="545" y="265" fill="#bff5ff" font-size="17" font-weight="700">DURABLE MEANING</text><text x="545" y="318" fill="#fff" font-size="32" font-weight="750">Data document</text><text x="545" y="370" fill="#e1f8ff" font-size="20">stable id</text><text x="545" y="410" fill="#e1f8ff" font-size="20">content fields</text><text x="545" y="450" fill="#e1f8ff" font-size="20">document references</text><text x="545" y="490" fill="#e1f8ff" font-size="20">ACL and metadata</text>
    <rect x="950" y="260" width="360" height="250" rx="24" fill="#fff" stroke="#8871c3" stroke-width="2"/><text x="990" y="310" fill="#7459b1" font-size="17" font-weight="700">CONTEXT</text><text x="990" y="355" fill="#173650" font-size="28" font-weight="700">Layout delegate</text><text x="990" y="402" fill="#526d84" font-size="19">position and dimensions</text><text x="990" y="438" fill="#526d84" font-size="19">view / zoom / visibility</text><text x="990" y="474" fill="#526d84" font-size="19">delegates content reads</text>
    <rect x="180" y="650" width="360" height="130" rx="22" fill="#fff" stroke="#49a476" stroke-width="2"/><text x="220" y="700" fill="#278357" font-size="17" font-weight="700">REFERENCE</text><text x="220" y="744" fill="#173650" font-size="27" font-weight="700">ProxyField + cache</text>
    <rect x="950" y="650" width="360" height="130" rx="22" fill="#fff" stroke="#e39b3c" stroke-width="2"/><text x="990" y="700" fill="#ba6f17" font-size="17" font-weight="700">INTERPRETATION</text><text x="990" y="744" fill="#173650" font-size="27" font-weight="700">React view</text>
  </g>
  <g fill="none" stroke="#3c6688" stroke-width="4" marker-end="url(#a)"><path d="M400 385H500"/><path d="M850 385H950"/><path d="M540 715C650 715 610 560 675 560"/><path d="M1130 650V510"/></g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="17" fill="#3c6688"><text x="420" y="370">delegates to</text><text x="870" y="370">presents as</text><text x="570" y="682">resolves id</text><text x="1148" y="590">renders pair</text></g>
</svg>
