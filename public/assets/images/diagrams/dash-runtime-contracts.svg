<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dash runtime contract chain</title>
  <desc id="desc">A field change crosses user input, undo, document, synchronization, persistence, and rendering contracts. Each boundary names what it accepts and what it must guarantee.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset="1" stop-color="#e9efff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172554" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#3159c6"/>
    </marker>
    <style>
      .kicker{font:700 22px Inter,Segoe UI,sans-serif;letter-spacing:3px;fill:#3159c6}
      .title{font:700 48px Inter,Segoe UI,sans-serif;fill:#111c3a}
      .sub{font:400 23px Inter,Segoe UI,sans-serif;fill:#4c5877}
      .step{font:700 16px Inter,Segoe UI,sans-serif;letter-spacing:2px;fill:#3159c6}
      .name{font:700 28px Inter,Segoe UI,sans-serif;fill:#111c3a}
      .label{font:700 16px Inter,Segoe UI,sans-serif;fill:#58647f}
      .body{font:400 18px Inter,Segoe UI,sans-serif;fill:#283451}
      .footer{font:600 20px Inter,Segoe UI,sans-serif;fill:#172554}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="110" r="230" fill="#dce7ff" opacity="0.7"/>
  <circle cx="90" cy="850" r="250" fill="#dfeaff" opacity="0.75"/>

  <text class="kicker" x="100" y="92">ENGINEERING REFERENCE</text>
  <text class="title" x="100" y="155">One action crosses six contracts</text>
  <text class="sub" x="100" y="198">A feature is integrated only when every boundary preserves its guarantee.</text>

  <g filter="url(#shadow)">
    <g transform="translate(85 280)">
      <rect width="220" height="310" rx="18" fill="#fff" stroke="#b5c5ec" stroke-width="2"/>
      <rect width="220" height="8" rx="4" fill="#3159c6"/>
      <text class="step" x="24" y="48">01 · INPUT</text>
      <text class="name" x="24" y="88">UI action</text>
      <text class="label" x="24" y="132">ACCEPTS</text>
      <text class="body" x="24" y="160">Intent + target</text>
      <text class="label" x="24" y="207">GUARANTEES</text>
      <text class="body" x="24" y="235">Validated scope</text>
      <text class="body" x="24" y="263">Named action</text>
    </g>
    <g transform="translate(330 280)">
      <rect width="220" height="310" rx="18" fill="#fff" stroke="#b5c5ec" stroke-width="2"/>
      <rect width="220" height="8" rx="4" fill="#597fe0"/>
      <text class="step" x="24" y="48">02 · UNDO</text>
      <text class="name" x="24" y="88">Batch</text>
      <text class="label" x="24" y="132">ACCEPTS</text>
      <text class="body" x="24" y="160">Related mutations</text>
      <text class="label" x="24" y="207">GUARANTEES</text>
      <text class="body" x="24" y="235">Reverse order</text>
      <text class="body" x="24" y="263">One review unit</text>
    </g>
    <g transform="translate(575 280)">
      <rect width="220" height="310" rx="18" fill="#fff" stroke="#b5c5ec" stroke-width="2"/>
      <rect width="220" height="8" rx="4" fill="#6b95ef"/>
      <text class="step" x="24" y="48">03 · DOCUMENT</text>
      <text class="name" x="24" y="88">Doc proxy</text>
      <text class="label" x="24" y="132">ACCEPTS</text>
      <text class="body" x="24" y="160">Typed field value</text>
      <text class="label" x="24" y="207">GUARANTEES</text>
      <text class="body" x="24" y="235">Identity + owner</text>
      <text class="body" x="24" y="263">Observable change</text>
    </g>
    <g transform="translate(820 280)">
      <rect width="220" height="310" rx="18" fill="#fff" stroke="#b5c5ec" stroke-width="2"/>
      <rect width="220" height="8" rx="4" fill="#2d8a83"/>
      <text class="step" x="24" y="48">04 · SYNC</text>
      <text class="name" x="24" y="88">DocServer</text>
      <text class="label" x="24" y="132">ACCEPTS</text>
      <text class="body" x="24" y="160">ID + field diff</text>
      <text class="label" x="24" y="207">GUARANTEES</text>
      <text class="body" x="24" y="235">Cache identity</text>
      <text class="body" x="24" y="263">Peer update path</text>
    </g>
    <g transform="translate(1065 280)">
      <rect width="220" height="310" rx="18" fill="#fff" stroke="#b5c5ec" stroke-width="2"/>
      <rect width="220" height="8" rx="4" fill="#cc7b29"/>
      <text class="step" x="24" y="48">05 · STORAGE</text>
      <text class="name" x="24" y="88">MongoDB</text>
      <text class="label" x="24" y="132">ACCEPTS</text>
      <text class="body" x="24" y="160">Serialized operation</text>
      <text class="label" x="24" y="207">GUARANTEES</text>
      <text class="body" x="24" y="235">Per-ID ordering</text>
      <text class="body" x="24" y="263">Durable record</text>
    </g>
    <g transform="translate(1310 280)">
      <rect width="220" height="310" rx="18" fill="#fff" stroke="#b5c5ec" stroke-width="2"/>
      <rect width="220" height="8" rx="4" fill="#8b5fc7"/>
      <text class="step" x="24" y="48">06 · VIEW</text>
      <text class="name" x="24" y="88">Renderer</text>
      <text class="label" x="24" y="132">ACCEPTS</text>
      <text class="body" x="24" y="160">Resolved layout</text>
      <text class="label" x="24" y="207">GUARANTEES</text>
      <text class="body" x="24" y="235">Typed dispatch</text>
      <text class="body" x="24" y="263">Reactive output</text>
    </g>
  </g>

  <path d="M305 435H326M550 435H571M795 435H816M1040 435H1061M1285 435H1306" stroke="#3159c6" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="240" y="680" width="1120" height="105" rx="18" fill="#172554"/>
  <text class="footer" x="285" y="727" fill="#fff">Integration test:</text>
  <text class="body" x="445" y="727" fill="#e7edff">act → undo → save → reload → open in a second context → edit concurrently</text>
  <text class="body" x="285" y="760" fill="#bfcdf5">A successful render proves only the last contract; it does not prove persistence, identity, or reversibility.</text>
</svg>
