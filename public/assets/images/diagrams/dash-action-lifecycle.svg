<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dash action lifecycle</title>
  <desc id="desc">A sequence diagram showing local input, undo batching, document mutation, reactive rendering, Socket.IO synchronization, MongoDB persistence, and remote updates.</desc>
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1727"/><stop offset="1" stop-color="#17273d"/></linearGradient><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#83a8cc"/></marker></defs>
  <rect width="1600" height="900" rx="32" fill="url(#b)"/>
  <text x="85" y="78" fill="#f7fbff" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="700">One action has a local, durable, and collaborative lifecycle</text>
  <text x="85" y="120" fill="#a7bed2" font-family="Inter,Segoe UI,sans-serif" font-size="22">A re-render is only the local middle of the path.</text>
  <g font-family="Inter,Segoe UI,sans-serif">
    <g fill="#1b354e" stroke="#335875"><rect x="75" y="190" width="190" height="90" rx="18"/><rect x="320" y="190" width="190" height="90" rx="18"/><rect x="565" y="190" width="190" height="90" rx="18"/><rect x="810" y="190" width="190" height="90" rx="18"/><rect x="1055" y="190" width="190" height="90" rx="18"/><rect x="1300" y="190" width="220" height="90" rx="18"/></g>
    <g fill="#f4f8fc" font-size="21" font-weight="650" text-anchor="middle"><text x="170" y="245">Input / tool</text><text x="415" y="245">UndoManager</text><text x="660" y="245">Doc + Field</text><text x="905" y="245">MobX + React</text><text x="1150" y="245">Socket server</text><text x="1410" y="245">MongoDB</text></g>
    <g stroke="#35536b" stroke-width="2" stroke-dasharray="8 10"><path d="M170 300V785"/><path d="M415 300V785"/><path d="M660 300V785"/><path d="M905 300V785"/><path d="M1150 300V785"/><path d="M1410 300V785"/></g>
    <g fill="none" stroke="#83a8cc" stroke-width="4" marker-end="url(#ar)"><path d="M170 350H415"/><path d="M415 420H660"/><path d="M660 490H905"/><path d="M660 560H1150"/><path d="M1150 630H1410"/><path d="M1410 700H1150"/><path d="M1150 770H905"/></g>
    <g fill="#dceaf5" font-size="18"><text x="210" y="338">start semantic batch</text><text x="455" y="408">validate + mutate field</text><text x="700" y="478">observable invalidation</text><text x="800" y="548">serialized diff: id + operation</text><text x="1190" y="618">apply update</text><text x="1190" y="688">accepted state</text><text x="930" y="758">broadcast remote diff</text></g>
    <rect x="85" y="820" width="1430" height="44" rx="12" fill="#112b42"/><text x="800" y="849" text-anchor="middle" fill="#79d8a9" font-size="18" font-weight="650">Undo correctness, persistence correctness, and collaboration correctness are separate properties and all require tests.</text>
  </g>
</svg>
