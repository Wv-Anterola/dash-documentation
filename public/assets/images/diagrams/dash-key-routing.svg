<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How Dash routes a keystroke</title>
  <desc id="desc">A keystroke is first offered to the focused freeform canvas and any active marquee, then to a global router that builds a four-bit modifier index from Shift, Ctrl, Alt and Cmd. Only five of the sixteen combinations are registered, the macOS table maps the Control key to the Alt handler and leaves Option unrouted, and each handler decides whether the browser default survives.</desc>
  <defs>
    <linearGradient id="kbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06171a"/>
      <stop offset="0.5" stop-color="#082126"/>
      <stop offset="1" stop-color="#0c2a2c"/>
    </linearGradient>
    <linearGradient id="kwarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb457"/>
      <stop offset="1" stop-color="#ff7a6b"/>
    </linearGradient>
    <linearGradient id="kcool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fe0c0"/>
      <stop offset="1" stop-color="#57b6ff"/>
    </linearGradient>
    <filter id="kshadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020c0d" flood-opacity="0.5"/>
    </filter>
    <filter id="kglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <marker id="karrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#5fe0c0"/>
    </marker>
    <marker id="kstop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#ff8f6b"/>
    </marker>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .keyebrow { fill: #6fe0c4; font-size: 18px; font-weight: 800; letter-spacing: 3px; }
      .khead { fill: #f2fdfb; font-size: 47px; font-weight: 800; letter-spacing: -1px; }
      .ksub { fill: #a8c4c4; font-size: 21px; }
      .kstage { fill: #7fe6cf; font-size: 14px; font-weight: 850; letter-spacing: 1.8px; }
      .kcard { fill: #eefcf9; font-size: 19px; font-weight: 780; }
      .kbody { fill: #a3bcbc; font-size: 15px; }
      .kcode { fill: #b8f0e2; font-size: 14px; }
      .kbit { fill: #eefcf9; font-size: 22px; font-weight: 800; }
      .kbitlabel { fill: #7fa6a6; font-size: 12px; font-weight: 750; letter-spacing: 1px; }
      .kwarn { fill: #ffc79a; font-size: 15px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#kbg)"/>
  <circle cx="250" cy="120" r="220" fill="#1f8f86" opacity="0.15" filter="url(#kglow)"/>
  <circle cx="1350" cy="800" r="230" fill="#2f6fbf" opacity="0.13" filter="url(#kglow)"/>

  <g class="ui">
    <text x="72" y="60" class="keyebrow">DASH KEY ROUTING</text>
    <text x="72" y="115" class="khead">One keystroke, three chances to be claimed</text>
    <text x="72" y="152" class="ksub">Canvas → marquee → four-bit modifier router → handler → what the browser is still allowed to do</text>

    <!-- Stage 1: focus-ordered claims -->
    <text x="72" y="208" class="kstage">1 · WHO GETS IT FIRST</text>
    <g filter="url(#kshadow)">
      <rect x="72" y="224" width="330" height="300" rx="20" fill="#0e2b2e" stroke="#2c5e5c" stroke-width="2"/>
    </g>
    <rect x="96" y="248" width="282" height="72" rx="13" fill="#14383a" stroke="#3f7f79" stroke-width="2"/>
    <text x="116" y="276" class="kcard mono">MarqueeView.onKeyDown</text>
    <text x="116" y="300" class="kbody">A focused freeform canvas.</text>
    <path d="M237 320L237 344" stroke="#5fe0c0" stroke-width="2.5" marker-end="url(#karrow)"/>
    <rect x="96" y="350" width="282" height="72" rx="13" fill="#14383a" stroke="#3f7f79" stroke-width="2"/>
    <text x="116" y="378" class="kcard mono">marqueeCommand</text>
    <text x="116" y="402" class="kbody">An active marquee selection.</text>
    <path d="M237 422L237 446" stroke="#5fe0c0" stroke-width="2.5" marker-end="url(#karrow)"/>
    <rect x="96" y="452" width="282" height="56" rx="13" fill="#1b4a45" stroke="#5aa79c" stroke-width="2.5"/>
    <text x="116" y="487" class="kcard mono">KeyManager</text>

    <rect x="72" y="546" width="330" height="88" rx="14" fill="#231c18" stroke="#8a6244" stroke-width="2"/>
    <text x="96" y="574" class="kwarn">The canvas has a catch-all branch.</text>
    <text x="96" y="597" class="kbody">Any ordinary character starts a text</text>
    <text x="96" y="618" class="kbody">note, so most plain letters never reach</text>
    <text x="96" y="639" class="kbody" opacity="0">.</text>
    <text x="96" y="638" class="kbody">the global router at all.</text>

    <path d="M402 480L448 480" stroke="#5fe0c0" stroke-width="2.5" marker-end="url(#karrow)"/>

    <!-- Stage 2: the modifier index -->
    <text x="448" y="208" class="kstage">2 · THE MODIFIER INDEX</text>
    <g filter="url(#kshadow)">
      <rect x="448" y="224" width="450" height="410" rx="20" fill="#0e2b2e" stroke="#2c5e5c" stroke-width="2"/>
    </g>
    <text x="472" y="256" class="kbody">Four bits, always in this order:</text>

    <g>
      <rect x="472" y="272" width="96" height="76" rx="12" fill="#14383a" stroke="#3f7f79" stroke-width="2"/>
      <text x="504" y="312" class="kbit">1</text>
      <text x="490" y="336" class="kbitlabel">SHIFT</text>
      <rect x="580" y="272" width="96" height="76" rx="12" fill="#14383a" stroke="#3f7f79" stroke-width="2"/>
      <text x="612" y="312" class="kbit">0</text>
      <text x="602" y="336" class="kbitlabel">CTRL</text>
      <rect x="688" y="272" width="96" height="76" rx="12" fill="#14383a" stroke="#3f7f79" stroke-width="2"/>
      <text x="720" y="312" class="kbit">0</text>
      <text x="712" y="336" class="kbitlabel">ALT</text>
      <rect x="796" y="272" width="78" height="76" rx="12" fill="#14383a" stroke="#3f7f79" stroke-width="2"/>
      <text x="822" y="312" class="kbit">0</text>
      <text x="810" y="336" class="kbitlabel">CMD</text>
    </g>
    <text x="472" y="376" class="kbody mono">'1000' → the shift handler</text>

    <text x="472" y="418" class="kstage">ONLY FIVE COMBINATIONS ARE REGISTERED</text>
    <g>
      <rect x="472" y="434" width="402" height="40" rx="9" fill="#14383a" stroke="#3f7f79" stroke-width="1.6"/>
      <text x="492" y="460" class="kcode mono">0000  unmodified</text>
      <rect x="472" y="482" width="402" height="40" rx="9" fill="#14383a" stroke="#3f7f79" stroke-width="1.6"/>
      <text x="492" y="508" class="kcode mono">0100 / 0001  ctrl        (Ctrl · Cmd)</text>
      <rect x="472" y="530" width="402" height="40" rx="9" fill="#2a2018" stroke="#a5734a" stroke-width="1.8"/>
      <text x="492" y="556" class="kcode mono">0010 / 0100  alt         (Alt · Control)</text>
      <rect x="472" y="578" width="196" height="40" rx="9" fill="#14383a" stroke="#3f7f79" stroke-width="1.6"/>
      <text x="492" y="604" class="kcode mono">1000  shift</text>
      <rect x="678" y="578" width="196" height="40" rx="9" fill="#14383a" stroke="#3f7f79" stroke-width="1.6"/>
      <text x="698" y="604" class="kcode mono">1100 / 1001  ctrl+shift</text>
    </g>

    <rect x="448" y="654" width="450" height="86" rx="14" fill="#231c18" stroke="#8a6244" stroke-width="2"/>
    <text x="472" y="682" class="kwarn">macOS is not a Cmd-for-Ctrl swap.</text>
    <text x="472" y="705" class="kbody">The Control key runs the Alt handler, and the</text>
    <text x="472" y="726" class="kbody">Option key is not routed at all.</text>

    <rect x="448" y="756" width="450" height="62" rx="14" fill="#0e2b2e" stroke="#2c5e5c" stroke-width="1.6"/>
    <text x="472" y="782" class="kbody">The other eleven combinations, including</text>
    <text x="472" y="804" class="kbody mono">Ctrl+Alt and every three-modifier chord, are dropped.</text>

    <path d="M898 460L944 460" stroke="#5fe0c0" stroke-width="2.5" marker-end="url(#karrow)"/>

    <!-- Stage 3: the handler and the browser -->
    <text x="944" y="208" class="kstage">3 · THE HANDLER DECIDES</text>
    <g filter="url(#kshadow)">
      <rect x="944" y="224" width="330" height="410" rx="20" fill="#0e2b2e" stroke="#2c5e5c" stroke-width="2"/>
    </g>
    <text x="968" y="256" class="kbody">A switch over the lowercased key name.</text>

    <rect x="968" y="274" width="282" height="90" rx="13" fill="#14383a" stroke="#3f7f79" stroke-width="2"/>
    <text x="988" y="302" class="kcard mono">case 'z':</text>
    <text x="988" y="326" class="kbody">Guarded, then it acts.</text>
    <text x="988" y="348" class="kbody mono">ActivePage !== 'home'</text>

    <rect x="968" y="380" width="282" height="76" rx="13" fill="#14383a" stroke="#3f7f79" stroke-width="2"/>
    <text x="988" y="408" class="kcard mono">case ' ': break;</text>
    <text x="988" y="432" class="kbody">Claimed, but the body is empty.</text>

    <rect x="968" y="472" width="282" height="140" rx="13" fill="#14383a" stroke="#3f7f79" stroke-width="2"/>
    <text x="988" y="500" class="kcard">Two switches, always</text>
    <text x="988" y="526" class="kbody mono">stopPropagation</text>
    <text x="988" y="547" class="kbody">Nothing further sees the event.</text>
    <text x="988" y="574" class="kbody mono">preventDefault</text>
    <text x="988" y="595" class="kbody">The browser default is cancelled.</text>

    <path d="M1274 540L1318 540" stroke="#ff8f6b" stroke-width="2.5" marker-end="url(#kstop)"/>

    <!-- Right rail: outcomes -->
    <text x="1318" y="208" class="kstage">WHAT REACHES THE BROWSER</text>
    <g filter="url(#kshadow)">
      <rect x="1318" y="224" width="210" height="410" rx="20" fill="#0e2b2e" stroke="#2c5e5c" stroke-width="2"/>
    </g>

    <rect x="1340" y="248" width="166" height="6" rx="3" fill="url(#kcool)"/>
    <text x="1340" y="286" class="kcard">Kept</text>
    <text x="1340" y="311" class="kbody mono">Ctrl+R</text>
    <text x="1340" y="333" class="kbody">reload still works</text>
    <text x="1340" y="357" class="kbody mono">Ctrl+V</text>
    <text x="1340" y="379" class="kbody">paste event fires</text>

    <rect x="1340" y="410" width="166" height="6" rx="3" fill="url(#kwarm)"/>
    <text x="1340" y="448" class="kcard">Taken</text>
    <text x="1340" y="473" class="kbody mono">Ctrl+S</text>
    <text x="1340" y="495" class="kbody">opens Trails, not Save</text>
    <text x="1340" y="519" class="kbody mono">Ctrl+A</text>
    <text x="1340" y="541" class="kbody">swallowed on the body</text>
    <text x="1340" y="565" class="kbody mono">Ctrl+F</text>
    <text x="1340" y="587" class="kbody">Dash search instead</text>

    <text x="944" y="686" class="kbody">Clipboard chords are document-shaped: copy and cut write</text>
    <text x="944" y="710" class="kbody mono">__DashCloneId(x,y):id  ·  __DashDocId(x,y):id</text>
    <text x="944" y="734" class="kbody">so pasting outside Dash yields an identifier, not content.</text>

    <text x="72" y="852" class="kbody">Routing table, case bodies, and event-control outcomes are generated from the pinned Dash-Web baseline; bit values shown are one example chord.</text>
    <text x="72" y="876" class="kbody mono">GlobalKeyHandler.ts · MarqueeView.tsx</text>
  </g>
</svg>
