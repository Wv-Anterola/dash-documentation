<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dash field runtime from assignment to hydration</title>
  <desc id="desc">A six-stage technical diagram showing a user action becoming a typed field, a parent-aware change notification, a serialized type-tagged operation, a persisted document record, and an identity-preserving hydrated value.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef3ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1d3260" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3757c5"/></marker>
    <style>
      .card{fill:#fff;stroke:#cbd7f5;stroke-width:2;rx:24;filter:url(#shadow)}.num{fill:#3757c5}.n{font:700 23px system-ui,sans-serif;fill:#fff;text-anchor:middle}.h{font:700 28px system-ui,sans-serif;fill:#16233f}.b{font:20px system-ui,sans-serif;fill:#43516f}.mono{font:18px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#243459}.flow{fill:none;stroke:#3757c5;stroke-width:5;marker-end:url(#arrow)}.tag{fill:#eef2ff;stroke:#aebff1;stroke-width:1.5;rx:12}.th{font:700 18px system-ui,sans-serif;fill:#304b9b}.title{font:800 43px system-ui,sans-serif;fill:#14213d}.sub{font:22px system-ui,sans-serif;fill:#4d5c7b}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text class="title" x="90" y="85">A Dash field is a value with a persistence lifecycle</text>
  <text class="sub" x="90" y="125">The runtime preserves type, ownership, change propagation, storage shape, and document identity.</text>

  <path class="flow" d="M315 300H390"/><path class="flow" d="M650 300H725"/><path class="flow" d="M985 300H1060"/><path class="flow" d="M1320 300H1390Q1460 300 1460 370V560Q1460 630 1390 630H1320"/><path class="flow" d="M1060 630H985"/><path class="flow" d="M725 630H650"/>

  <g transform="translate(55 180)"><rect class="card" width="260" height="240"/><circle class="num" cx="42" cy="42" r="25"/><text class="n" x="42" y="50">1</text><text class="h" x="28" y="95">Assignment</text><text class="mono" x="28" y="135">doc.title = "Idea"</text><text class="b" x="28" y="180">The document proxy</text><text class="b" x="28" y="208">intercepts the write.</text></g>
  <g transform="translate(390 180)"><rect class="card" width="260" height="240"/><circle class="num" cx="42" cy="42" r="25"/><text class="n" x="42" y="50">2</text><text class="h" x="28" y="95">Typed value</text><rect class="tag" x="28" y="125" width="86" height="36"/><text class="th" x="43" y="150">primitive</text><rect class="tag" x="124" y="125" width="104" height="36"/><text class="th" x="139" y="150">ObjectField</text><text class="b" x="28" y="198">Docs become proxies;</text><text class="b" x="28" y="226">objects gain a parent.</text></g>
  <g transform="translate(725 180)"><rect class="card" width="260" height="240"/><circle class="num" cx="42" cy="42" r="25"/><text class="n" x="42" y="50">3</text><text class="h" x="28" y="95">Change event</text><text class="mono" x="28" y="136">FieldChanged(diff)</text><text class="b" x="28" y="180">The parent converts a</text><text class="b" x="28" y="208">nested edit into a</text><text class="b" x="28" y="236">document operation.</text></g>
  <g transform="translate(1060 180)"><rect class="card" width="260" height="240"/><circle class="num" cx="42" cy="42" r="25"/><text class="n" x="42" y="50">4</text><text class="h" x="28" y="95">Wire form</text><text class="mono" x="28" y="136">$set / $unset</text><text class="mono" x="28" y="168">__type: "list"</text><text class="b" x="28" y="210">Only registered object</text><text class="b" x="28" y="238">types can serialize.</text></g>
  <g transform="translate(1060 510)"><rect class="card" width="260" height="240"/><circle class="num" cx="42" cy="42" r="25"/><text class="n" x="42" y="50">5</text><text class="h" x="28" y="95">Persistence</text><text class="mono" x="28" y="136">{ id, fields }</text><text class="b" x="28" y="180">MongoDB stores one</text><text class="b" x="28" y="208">serialized record per</text><text class="b" x="28" y="236">document identity.</text></g>
  <g transform="translate(725 510)"><rect class="card" width="260" height="240"/><circle class="num" cx="42" cy="42" r="25"/><text class="n" x="42" y="50">6</text><text class="h" x="28" y="95">Hydration</text><text class="mono" x="28" y="136">Deserialize(__type)</text><text class="b" x="28" y="180">Parents, callbacks, and</text><text class="b" x="28" y="208">references are restored</text><text class="b" x="28" y="236">after construction.</text></g>
  <g transform="translate(390 510)"><rect class="card" width="260" height="240"/><circle class="num" cx="42" cy="42" r="25"/><text class="n" x="42" y="50">7</text><text class="h" x="28" y="95">Identity cache</text><text class="mono" x="28" y="136">id → Doc | Promise</text><text class="b" x="28" y="180">Cold reads converge on</text><text class="b" x="28" y="208">one client object for</text><text class="b" x="28" y="236">each document ID.</text></g>
  <rect x="55" y="804" width="1490" height="50" rx="18" fill="#172957"/><text x="800" y="837" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#fff">Invariant: a visible edit is durable only after its serialized operation reaches storage; local reactivity is not an acknowledgement.</text>
</svg>
