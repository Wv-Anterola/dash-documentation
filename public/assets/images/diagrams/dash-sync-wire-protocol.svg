<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dash synchronization protocol and acknowledgement boundaries</title>
  <desc id="desc">A sequence diagram showing client handshake, callback-based reads, optimistic unacknowledged writes, per-document server queues, MongoDB persistence, peer broadcast, and list reconciliation back to the origin when needed.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef3ff"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3458c4"/></marker><marker id="w" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d47a15"/></marker><style>.title{font:800 43px system-ui,sans-serif;fill:#14213d}.sub{font:22px system-ui,sans-serif;fill:#4d5c7b}.lane{fill:#fff;stroke:#c9d6f4;stroke-width:2;rx:20}.lh{font:700 25px system-ui,sans-serif;fill:#1d315f;text-anchor:middle}.life{stroke:#b8c6ea;stroke-width:3;stroke-dasharray:8 10}.arr{stroke:#3458c4;stroke-width:4;marker-end:url(#a)}.warn{stroke:#d47a15;stroke-width:4;stroke-dasharray:10 7;marker-end:url(#w)}.lab{font:19px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#243459}.note{fill:#fff7e8;stroke:#edbd72;stroke-width:2;rx:14}.nt{font:18px system-ui,sans-serif;fill:#74420e}.ok{fill:#edf8f3;stroke:#8bc9aa;stroke-width:2;rx:14}.ot{font:18px system-ui,sans-serif;fill:#245e45}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text class="title" x="75" y="72">Dash synchronization: confirmation boundaries</text><text class="sub" x="75" y="112">Socket.IO transports deterministic event IDs; reads use callbacks, ordinary writes use peer broadcast after persistence.</text>
  <g transform="translate(70 150)"><rect class="lane" width="250" height="72"/><text class="lh" x="125" y="45">Client A</text></g><g transform="translate(480 150)"><rect class="lane" width="250" height="72"/><text class="lh" x="125" y="45">WebSocket server</text></g><g transform="translate(890 150)"><rect class="lane" width="250" height="72"/><text class="lh" x="125" y="45">MongoDB</text></g><g transform="translate(1280 150)"><rect class="lane" width="250" height="72"/><text class="lh" x="125" y="45">Client B</text></g>
  <path class="life" d="M195 222V830M605 222V830M1015 222V830M1405 222V830"/>
  <line class="arr" x1="605" y1="270" x2="205" y2="270"/><text class="lab" x="305" y="258">Foo(handshake)</text><line class="arr" x1="195" y1="310" x2="595" y2="310"/><text class="lab" x="280" y="300">Bar(user identifier)</text>
  <line class="arr" x1="195" y1="390" x2="595" y2="390"/><text class="lab" x="250" y="380">Get Ref Field(id, callback)</text><line class="arr" x1="605" y1="430" x2="1005" y2="430"/><text class="lab" x="720" y="420">read by id</text><line class="arr" x1="1015" y1="470" x2="615" y2="470"/><text class="lab" x="750" y="460">serialized record</text><line class="arr" x1="605" y1="510" x2="205" y2="510"/><text class="lab" x="290" y="500">callback(record)</text>
  <line class="arr" x1="195" y1="590" x2="595" y2="590"/><text class="lab" x="245" y="580">Update Ref Field({id,diff})</text><rect class="note" x="72" y="615" width="300" height="58"/><text class="nt" x="94" y="640">Client A already changed local state.</text><text class="nt" x="94" y="662">No success/error callback is attached.</text>
  <line class="arr" x1="605" y1="700" x2="1005" y2="700"/><text class="lab" x="672" y="690">per-ID queued update</text><line class="arr" x1="1015" y1="745" x2="615" y2="745"/><text class="lab" x="752" y="735">DB callback</text><line class="arr" x1="605" y1="790" x2="1395" y2="790"/><text class="lab" x="850" y="780">broadcast accepted diff</text>
  <rect class="ok" x="1165" y="610" width="355" height="90"/><text class="ot" x="1187" y="638">List reconciliation exception:</text><text class="ot" x="1187" y="664">if server length differs, the composite</text><text class="ot" x="1187" y="687">list can be emitted back to Client A.</text>
  <text x="800" y="865" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#5a3510">A peer receiving a diff proves the database callback ran; the initiating client has no ordinary write acknowledgement.</text>
</svg>
