<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dash documentation evidence flow</title>
  <desc id="desc">Runtime behavior, implementation source, and research artifacts provide evidence for user guides, architecture documentation, API reference, and research records.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#25345f" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#5269d8"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1445" cy="118" r="180" fill="#dfe5ff" opacity="0.65"/><circle cx="105" cy="820" r="220" fill="#e8ddff" opacity="0.6"/>
  <text x="100" y="105" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="750" fill="#17213f">How a technical claim becomes documentation</text>
  <text x="102" y="158" font-family="Inter,Arial,sans-serif" font-size="25" fill="#526078">Each audience sees the evidence it needs. Reproducibility stays available without interrupting the explanation.</text>
  <g filter="url(#shadow)"><rect x="100" y="250" width="350" height="230" rx="26" fill="#fff" stroke="#cbd5ff" stroke-width="3"/><rect x="625" y="250" width="350" height="230" rx="26" fill="#fff" stroke="#cbd5ff" stroke-width="3"/><rect x="1150" y="250" width="350" height="230" rx="26" fill="#fff" stroke="#cbd5ff" stroke-width="3"/></g>
  <g font-family="Inter,Arial,sans-serif">
    <circle cx="155" cy="310" r="28" fill="#315bd6"/><path d="M143 310l8 8 17-19" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="200" y="319" font-size="31" font-weight="720" fill="#17213f">Observed behavior</text><text x="140" y="375" font-size="24" fill="#526078">Runtime capture</text><text x="140" y="414" font-size="24" fill="#526078">Executable test</text><text x="140" y="453" font-size="24" fill="#526078">Visible entry point</text>
    <circle cx="680" cy="310" r="28" fill="#6d4dd6"/><path d="M666 296h28v28h-28zM674 304h12v12h-12z" fill="#fff" fill-rule="evenodd"/>
    <text x="725" y="319" font-size="31" font-weight="720" fill="#17213f">Implementation</text><text x="665" y="375" font-size="24" fill="#526078">Typed registry</text><text x="665" y="414" font-size="24" fill="#526078">Symbol and call path</text><text x="665" y="453" font-size="24" fill="#526078">Lifecycle contract</text>
    <circle cx="1205" cy="310" r="28" fill="#198a83"/><path d="M1192 296h26v30h-26zM1198 304h14M1198 312h14M1198 320h9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="1250" y="319" font-size="31" font-weight="720" fill="#17213f">Research record</text><text x="1190" y="375" font-size="24" fill="#526078">Question and method</text><text x="1190" y="414" font-size="24" fill="#526078">Artifact or publication</text><text x="1190" y="453" font-size="24" fill="#526078">Evaluation and limits</text>
  </g>
  <path d="M450 365H604M975 365h154" stroke="#5269d8" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M275 500v95h1050v-95" fill="none" stroke="#98a6e8" stroke-width="5"/><path d="M800 595v65" stroke="#5269d8" stroke-width="6" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="250" y="680" width="1100" height="130" rx="28" fill="#17213f"/></g>
  <text x="800" y="734" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="740" fill="#fff">Published documentation</text>
  <text x="800" y="780" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" fill="#d9e0ff">Guide · Concept · Architecture · API reference · Research archive</text>
</svg>
