<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dash trust boundaries and enforcement locations</title>
  <desc id="desc">A layered threat-model diagram separating browser controls, HTTP session authentication, the Socket.IO identity handshake, server mutation handlers, MongoDB, uploads, and third-party services, with labels showing where enforcement is present or still required.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#eef3ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1d3260" flood-opacity=".12"/></filter><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#405db8"/></marker><style>.title{font:800 43px system-ui,sans-serif;fill:#14213d}.sub{font:22px system-ui,sans-serif;fill:#4d5c7b}.zone{fill:#fff;stroke:#c8d5f2;stroke-width:2;rx:24;filter:url(#s)}.zh{font:700 27px system-ui,sans-serif;fill:#1b315f}.b{font:19px system-ui,sans-serif;fill:#40506f}.yes{fill:#e8f7ef;stroke:#79bf9d;stroke-width:2;rx:11}.req{fill:#fff2df;stroke:#e0a04a;stroke-width:2;rx:11}.yt{font:700 17px system-ui,sans-serif;fill:#236146}.rt{font:700 17px system-ui,sans-serif;fill:#7b450b}.arr{stroke:#405db8;stroke-width:4;marker-end:url(#a)}.boundary{fill:none;stroke:#8ca2d8;stroke-width:3;stroke-dasharray:12 10;rx:28}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text class="title" x="75" y="72">Trust is a server decision, not a hidden-button decision</text><text class="sub" x="75" y="112">The canonical implementation has authentication components, but WebSocket mutation authorization is a separate boundary.</text>
  <rect class="boundary" x="45" y="145" width="1510" height="650"/>
  <g transform="translate(75 190)"><rect class="zone" width="320" height="230"/><text class="zh" x="28" y="50">Browser client</text><text class="b" x="28" y="88">MobX state and document cache</text><text class="b" x="28" y="120">Read-only and guest suppression</text><text class="b" x="28" y="152">Provider configuration</text><rect class="yes" x="28" y="177" width="212" height="34"/><text class="yt" x="44" y="200">UX safeguard present</text></g>
  <g transform="translate(470 190)"><rect class="zone" width="320" height="230"/><text class="zh" x="28" y="50">HTTP + sessions</text><text class="b" x="28" y="88">Passport login and bcrypt hash</text><text class="b" x="28" y="120">Session-backed route handlers</text><text class="b" x="28" y="152">User document identifiers</text><rect class="yes" x="28" y="177" width="231" height="34"/><text class="yt" x="44" y="200">Authentication path present</text></g>
  <g transform="translate(865 190)"><rect class="zone" width="320" height="230"/><text class="zh" x="28" y="50">Socket.IO boundary</text><text class="b" x="28" y="88">Client-supplied identifier handshake</text><text class="b" x="28" y="120">Create/update/delete handlers</text><text class="b" x="28" y="152">Per-document operation queue</text><rect class="req" x="28" y="177" width="251" height="34"/><text class="rt" x="44" y="200">Server authorization required</text></g>
  <g transform="translate(1260 190)"><rect class="zone" width="265" height="230"/><text class="zh" x="28" y="50">Persistence</text><text class="b" x="28" y="88">Mongo document records</text><text class="b" x="28" y="120">User/session records</text><text class="b" x="28" y="152">Uploaded files</text><rect class="req" x="28" y="177" width="210" height="34"/><text class="rt" x="44" y="200">Validate every write</text></g>
  <line class="arr" x1="395" y1="305" x2="460" y2="305"/><line class="arr" x1="790" y1="305" x2="855" y2="305"/><line class="arr" x1="1185" y1="305" x2="1250" y2="305"/>
  <g transform="translate(230 520)"><rect class="zone" width="500" height="205"/><text class="zh" x="28" y="50">Embedded and imported content</text><text class="b" x="28" y="88">HTML iframe allows scripts + same origin</text><text class="b" x="28" y="120">postMessage uses a wildcard target origin</text><text class="b" x="28" y="152">Uploads and URLs enter server pipelines</text><rect class="req" x="28" y="165" width="327" height="30"/><text class="rt" x="44" y="186">Constrain origin, type, size, and content</text></g>
  <g transform="translate(870 520)"><rect class="zone" width="500" height="205"/><text class="zh" x="28" y="50">External services and models</text><text class="b" x="28" y="88">Map, search, calendar, AI, and media APIs</text><text class="b" x="28" y="120">Browser-exposed keys are not server secrets</text><text class="b" x="28" y="152">Tool scope is the application authority</text><rect class="req" x="28" y="165" width="314" height="30"/><text class="rt" x="44" y="186">Minimize keys, scope, retention, and egress</text></g>
  <text x="800" y="850" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#233a70">Documentation distinguishes controls observed in source from controls a production deployment must add or verify.</text>
</svg>
