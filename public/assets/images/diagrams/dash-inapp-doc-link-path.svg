<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The path a help link takes from Dash into this documentation</title>
  <desc id="desc">A help control in Dash opens a URL written for the old flat permalinks. The path is matched against this site's page list, then against its redirect table, and finally the fragment is checked against the target page's headings. Three outcomes are separated: a path that lands directly, a path that lands only because the host adds a trailing slash, and a fragment that no longer exists on the page it reaches.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#25345f" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#5269d8"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1455" cy="120" r="180" fill="#dfe5ff" opacity="0.6"/><circle cx="105" cy="828" r="205" fill="#e8ddff" opacity="0.55"/>

  <text x="100" y="102" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="750" fill="#17213f">The links that point the other way</text>
  <text x="102" y="152" font-family="Inter,Arial,sans-serif" font-size="25" fill="#526078">Dash ships help buttons into this site. Their URLs live in the application, so nobody editing a page ever sees them.</text>

  <!-- Stage 1 -->
  <g filter="url(#shadow)"><rect x="100" y="230" width="330" height="220" rx="26" fill="#fff" stroke="#cbd5ff" stroke-width="3"/></g>
  <g font-family="Inter,Arial,sans-serif">
    <circle cx="155" cy="290" r="28" fill="#315bd6"/><text x="155" y="301" text-anchor="middle" font-size="30" font-weight="750" fill="#fff">?</text>
    <text x="200" y="300" font-size="29" font-weight="720" fill="#17213f">A control</text>
    <text x="140" y="352" font-size="22" fill="#526078">Help entry in a menu</text>
    <text x="140" y="390" font-size="22" fill="#526078">Question mark in a dialog</text>
    <text x="140" y="428" font-size="22" fill="#526078">Info button in a toolbar</text>
  </g>

  <!-- Stage 2 -->
  <g filter="url(#shadow)"><rect x="500" y="230" width="380" height="220" rx="26" fill="#fff" stroke="#cbd5ff" stroke-width="3"/></g>
  <g font-family="Inter,Arial,sans-serif">
    <circle cx="555" cy="290" r="28" fill="#6d4dd6"/><path d="M542 279h26v22h-26z" fill="none" stroke="#fff" stroke-width="4"/><path d="M542 289h26" stroke="#fff" stroke-width="4"/>
    <text x="600" y="300" font-size="29" font-weight="720" fill="#17213f">An old URL</text>
    <text x="540" y="352" font-size="22" fill="#526078">Written for the Jekyll site</text>
    <text x="540" y="398" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="23" fill="#6d4dd6">/documents/pdf/</text>
    <text x="540" y="432" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="23" fill="#6d4dd6">/features/trails/#slide-…</text>
  </g>

  <!-- Stage 3 -->
  <g filter="url(#shadow)"><rect x="950" y="230" width="380" height="220" rx="26" fill="#fff" stroke="#cbd5ff" stroke-width="3"/></g>
  <g font-family="Inter,Arial,sans-serif">
    <circle cx="1005" cy="290" r="28" fill="#198a83"/><path d="M993 290l8 9 18-20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1050" y="300" font-size="29" font-weight="720" fill="#17213f">Resolved here</text>
    <text x="990" y="352" font-size="22" fill="#526078">1. Is it a page?</text>
    <text x="990" y="390" font-size="22" fill="#526078">2. Is it in the redirect table?</text>
    <text x="990" y="428" font-size="22" fill="#526078">3. Does the fragment exist?</text>
  </g>

  <path d="M430 340h56" stroke="#5269d8" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M880 340h56" stroke="#5269d8" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- Outcomes -->
  <text x="100" y="530" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#6b7796" letter-spacing="1.2">THREE OUTCOMES, KEPT APART BECAUSE THEY ARE NOT EQUALLY BAD</text>

  <g font-family="Inter,Arial,sans-serif">
    <g filter="url(#shadow)"><rect x="100" y="556" width="440" height="180" rx="24" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/></g>
    <text x="130" y="606" font-size="27" font-weight="720" fill="#14532d">It lands</text>
    <text x="130" y="650" font-size="22" fill="#166534">Directly, or through a redirect</text>
    <text x="130" y="688" font-size="22" fill="#166534">that this repository promises to</text>
    <text x="130" y="720" font-size="22" fill="#166534">keep.</text>

    <g filter="url(#shadow)"><rect x="580" y="556" width="440" height="180" rx="24" fill="#fffbeb" stroke="#fcd34d" stroke-width="3"/></g>
    <text x="610" y="606" font-size="27" font-weight="720" fill="#78350f">It lands, conditionally</text>
    <text x="610" y="650" font-size="22" fill="#92400e">The path has no trailing slash,</text>
    <text x="610" y="688" font-size="22" fill="#92400e">so it works only because the</text>
    <text x="610" y="720" font-size="22" fill="#92400e">host adds one.</text>

    <g filter="url(#shadow)"><rect x="1060" y="556" width="440" height="180" rx="24" fill="#fef2f2" stroke="#fca5a5" stroke-width="3"/></g>
    <text x="1090" y="606" font-size="27" font-weight="720" fill="#7f1d1d">It lands nowhere useful</text>
    <text x="1090" y="650" font-size="22" fill="#991b1b">A dead fragment is worse than a</text>
    <text x="1090" y="688" font-size="22" fill="#991b1b">404: the page loads and simply</text>
    <text x="1090" y="720" font-size="22" fill="#991b1b">does not answer the question.</text>
  </g>

  <g filter="url(#shadow)"><rect x="100" y="778" width="1400" height="86" rx="24" fill="#17213f"/></g>
  <text x="800" y="832" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" fill="#d9e0ff">The fix belongs in the application. A redirect added to accommodate a stale in-app URL hides the problem and multiplies it at the next restructure.</text>
</svg>
